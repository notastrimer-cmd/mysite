<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>artemchik.site</title>
  <style>
    :root {
      --bg: #030206;
      --card-bg: rgba(14, 15, 24, 0.6);
      --card-border: rgba(168, 85, 247, 0.2);
      --card-hover: rgba(216, 180, 254, 0.45);
      --accent: #b052f7;
      --glow-orange: #ff8438;
      --text: #f8fafc;
      --text-dim: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* Фуллскрин холст с чёрной дырой */
    #space-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      pointer-events: none;
    }

    /* Раскладка по краям экрана */
    .hud-layout {
      position: relative;
      z-index: 10;
      min-height: 100vh;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 40px 60px;
      gap: 30px;
    }

    .hud-column {
      width: 380px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* Парящий эффект для боковых панелей */
    .floating-left {
      animation: floatSide 7s ease-in-out infinite alternate;
    }
    .floating-right {
      animation: floatSide 8s ease-in-out infinite alternate-reverse;
    }

    @keyframes floatSide {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-12px); }
    }

    /* Стеклянные карточки (Glassmorphism) */
    .glass-panel {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 24px;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7),
                  inset 0 1px 0 rgba(255, 255, 255, 0.1);
      transition: all 0.35s ease;
    }

    .glass-panel:hover {
      border-color: var(--card-hover);
      box-shadow: 0 20px 50px rgba(176, 82, 247, 0.2),
                  inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }

    /* Верхний бейдж */
    .tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(176, 82, 247, 0.15);
      color: #e9d5ff;
      border: 1px solid rgba(176, 82, 247, 0.4);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.8px;
      margin-bottom: 14px;
    }

    .tag-pulse {
      width: 8px;
      height: 8px;
      background: #4ade80;
      border-radius: 50%;
      box-shadow: 0 0 10px #4ade80;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.3); opacity: 0.6; }
    }

    h1 {
      font-size: 1.9rem;
      line-height: 1.25;
      margin-bottom: 12px;
      font-weight: 800;
      background: linear-gradient(135deg, #fff 40%, #c084fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .bio {
      font-size: 0.95rem;
      line-height: 1.6;
      color: var(--text-dim);
    }

    /* Питомцы */
    .pet-card {
      padding: 0;
      overflow: hidden;
    }

    .pet-img-wrap {
      width: 100%;
      height: 240px;
      position: relative;
      background: #000;
    }

    .pet-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .pet-card:hover .pet-img-wrap img {
      transform: scale(1.05);
    }

    .pet-info {
      padding: 16px 20px;
    }

    .pet-name {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 2px;
    }

    .pet-desc {
      font-size: 0.85rem;
      color: var(--text-dim);
    }

    /* Правая колонка: Проекты */
    .section-title {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .section-title::before {
      content: '';
      width: 4px;
      height: 18px;
      background: #c084fc;
      border-radius: 4px;
      box-shadow: 0 0 10px #c084fc;
    }

    .project-link {
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-decoration: none;
      color: var(--text);
      padding: 18px 20px;
      position: relative;
      overflow: hidden;
    }

    .project-link::after {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      width: 3px;
      height: 100%;
      background: var(--accent);
      opacity: 0;
      transition: opacity 0.3s;
    }

    .project-link:hover::after {
      opacity: 1;
    }

    .project-link:hover {
      transform: translateX(-4px);
    }

    .project-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 4px;
    }

    .project-meta h3 {
      font-size: 1.05rem;
      font-weight: 600;
    }

    .project-meta p {
      font-size: 0.85rem;
      color: var(--text-dim);
    }

    .badge {
      font-size: 0.72rem;
      padding: 2px 8px;
      border-radius: 12px;
      background: rgba(168, 85, 247, 0.2);
      color: #e9d5ff;
      border: 1px solid rgba(168, 85, 247, 0.3);
      font-weight: 600;
    }

    .arrow {
      font-size: 1.2rem;
      color: #c084fc;
      transition: transform 0.2s;
      margin-left: 12px;
    }

    .project-link:hover .arrow {
      transform: translateX(4px);
      color: #fff;
    }

    footer {
      font-size: 0.8rem;
      color: rgba(148, 163, 184, 0.6);
      text-align: center;
      padding: 12px;
    }

    /* Адаптив под планшеты и мобилки */
    @media (max-width: 1024px) {
      .hud-layout {
        flex-direction: column;
        justify-content: center;
        padding: 30px 16px;
      }
      .hud-column {
        width: 100%;
        max-width: 540px;
      }
      .floating-left, .floating-right {
        animation: none;
      }
    }
  </style>
</head>
<body>

  <!-- Фон: Анимированная чёрная дыра и притягивающиеся звёзды -->
  <canvas id="space-canvas"></canvas>

  <div class="hud-layout">
    <!-- Левая колонка: Профиль и питомцы -->
    <div class="hud-column floating-left">
      <div class="glass-panel">
        <div class="tag">
          <span class="tag-pulse"></span>
          artemchik.site
        </div>
        <h1>Привет! Я Артём</h1>
        <p class="bio">
          Люблю вайбкодинг, PyCharm и космическую эстетику. Все проекты в открытом доступе справа.
        </p>
      </div>

      <div class="glass-panel pet-card">
        <div class="pet-img-wrap">
          <img src="pets.jpg" alt="Тая и Плюша" />
        </div>
        <div class="pet-info">
          <div class="pet-name">Тая и Плюша</div>
          <div class="pet-desc">Мои космические компаньоны</div>
        </div>
      </div>
    </div>

    <!-- Правая колонка: Проекты и ссылки -->
    <div class="hud-column floating-right">
      <div class="section-title">Проекты и релизы</div>
      
      <a href="https://drive.google.com/uc?export=download&id=1AzlP3jBcjbiMF32rsLNrUstv4zupoUYi" target="_blank" rel="noopener noreferrer" class="glass-panel project-link">
        <div class="project-meta">
          <div class="project-header">
            <h3>Премиум автокликер</h3>
            <span class="badge">1 мс</span>
          </div>
          <p>Скачать с Google Drive (прямой линк)</p>
        </div>
        <span class="arrow">&rarr;</span>
      </a>

      <div class="glass-panel footer-card">
        <footer>
          artemchik.site &bull; Singularity Engine
        </footer>
      </div>
    </div>
  </div>

  <!-- Движок чёрной дыры на HTML5 Canvas -->
  <script>
    const canvas = document.getElementById('space-canvas');
    const ctx = canvas.getContext('2d');

    let w, h, cx, cy;
    let particles = [];
    const PARTICLE_COUNT = 280;
    let rotationAngle = 0;

    function resize() {
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
      cx = w / 2;
      cy = h / 2;
    }

    class Particle {
      constructor() {
        this.reset(true);
      }
      reset(initial = false) {
        this.dist = initial ? Math.random() * (Math.max(w, h) * 0.7) + 90 : Math.max(w, h) * 0.6;
        this.angle = Math.random() * Math.PI * 2;
        this.speed = Math.random() * 0.6 + 0.3;
        this.size = Math.random() * 1.8 + 0.5;
        this.color = Math.random() > 0.4 ? '#c084fc' : '#ffaa44';
      }
      update() {
        // Спиральное затягивание в сингулярность
        this.dist -= this.speed * (1 + 180 / (this.dist + 10));
        this.angle += 0.008 + 1.8 / (this.dist + 20);

        if (this.dist < 75) {
          this.reset();
        }
      }
      draw() {
        // Проекция эллипса (эффект наклона диска)
        const x = cx + Math.cos(this.angle) * this.dist;
        const y = cy + Math.sin(this.angle) * (this.dist * 0.42);

        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(x, y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function init() {
      resize();
      particles = [];
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        particles.push(new Particle());
      }
    }

    function render() {
      ctx.fillStyle = 'rgba(3, 2, 6, 0.3)';
      ctx.fillRect(0, 0, w, h);

      rotationAngle += 0.015;

      // 1. Внешнее свечение
      const outerGlow = ctx.createRadialGradient(cx, cy, 60, cx, cy, 320);
      outerGlow.addColorStop(0, 'rgba(168, 85, 247, 0.4)');
      outerGlow.addColorStop(0.3, 'rgba(255, 120, 40, 0.25)');
      outerGlow.addColorStop(1, 'transparent');
      ctx.fillStyle = outerGlow;
      ctx.beginPath();
      ctx.arc(cx, cy, 320, 0, Math.PI * 2);
      ctx.fill();

      // 2. Отрисовка затягивающихся частиц
      particles.forEach(p => {
        p.update();
        p.draw();
      });

      // 3. Аккреционный диск (пылающий овал)
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(-0.18);
      ctx.scale(1, 0.38);

      const diskGrad = ctx.createRadialGradient(0, 0, 70, 0, 0, 260);
      diskGrad.addColorStop(0, '#ffffff');
      diskGrad.addColorStop(0.2, '#ffa347');
      diskGrad.addColorStop(0.55, '#c026d3');
      diskGrad.addColorStop(0.85, 'rgba(112, 26, 230, 0.4)');
      diskGrad.addColorStop(1, 'transparent');

      ctx.fillStyle = diskGrad;
      ctx.beginPath();
      ctx.arc(0, 0, 260, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // 4. Горизонт событий (абсолютная тень сингулярности)
      ctx.fillStyle = '#000000';
      ctx.shadowColor = '#ffffff';
      ctx.shadowBlur = 14;
      ctx.beginPath();
      ctx.arc(cx, cy, 76, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      requestAnimationFrame(render);
    }

    window.addEventListener('resize', resize);
    init();
    render();
  </script>
</body>
</html>
