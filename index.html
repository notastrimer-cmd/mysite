<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>artemchik.site — Космический уголок</title>
  <style>
    :root {
      --bg-base: #030307;
      --card-bg: rgba(18, 19, 26, 0.65);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-hover-border: rgba(168, 85, 247, 0.45);
      --accent-purple: #9d4edd;
      --accent-glow: #e0a96d;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Ubuntu, sans-serif;
      background-color: var(--bg-base);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 50px 20px;
    }

    /* === Сцена с чёрной дырой и звёздами === */
    .space-background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -2;
      overflow: hidden;
      background: radial-gradient(circle at center, #0b071a 0%, #030307 100%);
    }

    #starfield {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -2;
    }

    /* Чёрная дыра по центру */
    .black-hole-container {
      position: absolute;
      top: 30%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 600px;
      height: 600px;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: -1;
      opacity: 0.85;
      filter: blur(0.2px);
    }

    /* Аккреционный диск */
    .accretion-disk {
      position: absolute;
      width: 540px;
      height: 140px;
      border-radius: 50%;
      background: radial-gradient(ellipse at center, 
        rgba(255, 255, 255, 0.95) 0%, 
        rgba(255, 204, 112, 0.9) 25%, 
        rgba(247, 37, 133, 0.6) 55%, 
        rgba(114, 9, 183, 0.3) 75%, 
        transparent 100%);
      box-shadow: 
        0 0 60px rgba(255, 170, 50, 0.5),
        0 0 120px rgba(181, 23, 158, 0.4);
      transform: rotate(-14deg) scaleY(0.7);
      animation: disk-glow 8s ease-in-out infinite alternate;
    }

    /* Гравитационное кольцо линзирования */
    .gravitational-lensing {
      position: absolute;
      width: 250px;
      height: 250px;
      border-radius: 50%;
      border: 3px solid rgba(255, 215, 130, 0.8);
      box-shadow: 
        0 0 50px 10px rgba(247, 127, 0, 0.7),
        0 0 90px 25px rgba(114, 9, 183, 0.6),
        inset 0 0 40px rgba(255, 230, 150, 0.4);
      animation: rotate-ring 35s linear infinite;
    }

    /* Горизонт событий */
    .event-horizon {
      position: absolute;
      width: 175px;
      height: 175px;
      border-radius: 50%;
      background: #000;
      box-shadow: 
        0 0 25px 8px #000,
        0 0 4px 2px rgba(255, 255, 255, 0.6);
      z-index: 2;
    }

    @keyframes rotate-ring {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes disk-glow {
      0% { filter: brightness(1) drop-shadow(0 0 20px rgba(255, 150, 50, 0.4)); }
      100% { filter: brightness(1.25) drop-shadow(0 0 45px rgba(255, 100, 150, 0.6)); }
    }

    /* === Контентная часть === */
    .container {
      max-width: 680px;
      width: 100%;
      position: relative;
      z-index: 10;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(157, 78, 221, 0.12);
      color: #d8b4fe;
      border: 1px solid rgba(168, 85, 247, 0.3);
      padding: 6px 16px;
      border-radius: 30px;
      font-size: 0.82rem;
      font-weight: 600;
      margin-bottom: 20px;
      letter-spacing: 0.8px;
      backdrop-filter: blur(8px);
      box-shadow: 0 0 15px rgba(157, 78, 221, 0.2);
    }

    .tag-pulse {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #4ade80;
      box-shadow: 0 0 8px #4ade80;
    }

    h1 {
      font-size: 2.5rem;
      line-height: 1.25;
      margin-bottom: 16px;
      font-weight: 800;
      background: linear-gradient(135deg, #ffffff 30%, #e9d5ff 70%, #fbcfe8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }

    .bio {
      font-size: 1.05rem;
      line-height: 1.65;
      color: var(--text-muted);
      max-width: 580px;
      margin: 0 auto;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6);
    }

    /* === Карточка питомцев === */
    .pets-section {
      margin-bottom: 45px;
    }

    .pet-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 16px 40px -10px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(14px);
      transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1), border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .pet-card:hover {
      transform: translateY(-4px);
      border-color: var(--card-hover-border);
      box-shadow: 0 20px 45px -5px rgba(157, 78, 221, 0.25);
    }

    .pet-img-wrap {
      width: 100%;
      height: 420px;
      overflow: hidden;
      position: relative;
      background: rgba(10, 10, 15, 0.5);
    }

    .pet-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      transition: transform 0.5s ease;
    }

    .pet-card:hover .pet-img-wrap img {
      transform: scale(1.03);
    }

    .pet-img-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 80px;
      background: linear-gradient(to top, rgba(18, 19, 26, 0.95), transparent);
    }

    .pet-info {
      padding: 20px 26px;
    }

    .pet-name {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 4px;
      color: #fff;
    }

    .pet-desc {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    /* === Секция проектов === */
    .projects-section {
      margin-bottom: 40px;
    }

    .section-title {
      font-size: 1.35rem;
      margin-bottom: 18px;
      font-weight: 700;
      letter-spacing: -0.3px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .section-title::before {
      content: '';
      display: inline-block;
      width: 4px;
      height: 20px;
      background: linear-gradient(to bottom, #c084fc, #9333ea);
      border-radius: 4px;
    }

    .projects-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .project-link {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 24px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      color: var(--text-main);
      text-decoration: none;
      backdrop-filter: blur(14px);
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .project-link::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 10% 50%, rgba(168, 85, 247, 0.12), transparent 60%);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .project-link:hover {
      border-color: var(--card-hover-border);
      transform: translateX(5px);
      box-shadow: 0 12px 30px -5px rgba(157, 78, 221, 0.2);
    }

    .project-link:hover::before {
      opacity: 1;
    }

    .project-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 6px;
    }

    .project-meta h3 {
      font-size: 1.15rem;
      font-weight: 600;
    }

    .project-meta p {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      font-size: 0.75rem;
      padding: 3px 9px;
      border-radius: 20px;
      background: rgba(168, 85, 247, 0.15);
      color: #e9d5ff;
      border: 1px solid rgba(192, 132, 252, 0.35);
      font-weight: 600;
    }

    .arrow {
      font-size: 1.3rem;
      color: #c084fc;
      transition: transform 0.25s ease, color 0.2s ease;
      margin-left: 16px;
    }

    .project-link:hover .arrow {
      transform: translateX(6px);
      color: #f3e8ff;
    }

    footer {
      text-align: center;
      color: rgba(148, 163, 184, 0.6);
      font-size: 0.85rem;
      margin-top: 20px;
      padding-top: 24px;
      border-top: 1px solid var(--card-border);
    }

    @media (max-width: 640px) {
      body {
        padding: 30px 16px;
      }
      h1 {
        font-size: 2rem;
      }
      .pet-img-wrap {
        height: 320px;
      }
      .black-hole-container {
        width: 380px;
        height: 380px;
      }
      .accretion-disk {
        width: 360px;
        height: 90px;
      }
      .gravitational-lensing {
        width: 170px;
        height: 170px;
      }
      .event-horizon {
        width: 120px;
        height: 120px;
      }
    }
  </style>
</head>
<body>

  <!-- Фон: Звёздное поле и Чёрная дыра -->
  <div class="space-background">
    <canvas id="starfield"></canvas>
    <div class="black-hole-container">
      <div class="accretion-disk"></div>
      <div class="gravitational-lensing"></div>
      <div class="event-horizon"></div>
    </div>
  </div>

  <div class="container">
    <header>
      <div class="tag">
        <span class="tag-pulse"></span>
        artemchik.site
      </div>
      <h1>Привет! Меня зовут Артём</h1>
      <p class="bio">
        Я люблю вайбкодинг, PyCharm и свою кошку Таю и собачку Плюшу. 
        Ниже мои проекты, ссылка прямая.
      </p>
    </header>

    <section class="pets-section">
      <div class="pet-card">
        <div class="pet-img-wrap">
          <img src="pets.jpg" alt="Тая и Плюша" />
          <div class="pet-img-overlay"></div>
        </div>
        <div class="pet-info">
          <div class="pet-name">Тая и Плюша</div>
          <div class="pet-desc">Мои домашние питомцы</div>
        </div>
      </div>
    </section>

    <section class="projects-section">
      <h2 class="section-title">Мои проекты</h2>
      <div class="projects-list">
        
        <a href="https://drive.google.com/uc?export=download&id=1AzlP3jBcjbiMF32rsLNrUstv4zupoUYi" target="_blank" rel="noopener noreferrer" class="project-link">
          <div class="project-meta">
            <div class="project-header">
              <h3>Премиум автокликер</h3>
              <span class="badge">Точность 1 мс</span>
            </div>
            <p>Прямое скачивание с Google Drive</p>
          </div>
          <span class="arrow">&rarr;</span>
        </a>

      </div>
    </section>

    <footer>
      &copy; artemchik.site
    </footer>
  </div>

  <!-- Скрипт для живых мерцающих звёзд -->
  <script>
    const canvas = document.getElementById('starfield');
    const ctx = canvas.getContext('2d');

    let stars = [];
    const numStars = 120;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    function initStars() {
      stars = [];
      for (let i = 0; i < numStars; i++) {
        stars.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          radius: Math.random() * 1.4 + 0.3,
          alpha: Math.random() * 0.7 + 0.3,
          speed: Math.random() * 0.015 + 0.005,
          phase: Math.random() * Math.PI * 2
        });
      }
    }

    function animateStars() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      stars.forEach(star => {
        star.phase += star.speed;
        const currentAlpha = 0.2 + (Math.sin(star.phase) + 1) * 0.4 * star.alpha;

        ctx.beginPath();
        ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(230, 235, 255, ${currentAlpha})`;
        ctx.shadowBlur = star.radius * 2;
        ctx.shadowColor = 'rgba(255, 255, 255, 0.8)';
        ctx.fill();
      });

      requestAnimationFrame(animateStars);
    }

    window.addEventListener('resize', () => {
      resizeCanvas();
      initStars();
    });

    resizeCanvas();
    initStars();
    animateStars();
  </script>
</body>
</html>
